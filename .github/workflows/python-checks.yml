# Общие python-проверки для ci.yml и release.yml.
# Матрица HA: от MINIMUM_HA_VERSION (hacs.json / const.py) до текущего
# стабильного Core на PyPI. На месяц — последний патч + точный минимум.

name: python-checks

on:
  workflow_call:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  translations:
    name: Translation keys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare translation key paths
        run: bash scripts/check-translation-keys.sh

  ha-matrix:
    name: HA matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pytest matrix from PyPI
        id: gen
        run: |
          set -euo pipefail
          {
            echo "include<<EOF"
            python3 scripts/ha-ci-matrix.py
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  tests:
    name: Tests (HA ${{ matrix.ha }})
    needs: ha-matrix
    # ubuntu-latest сейчас 26.04 — у setup-python нет сборок 3.14.x под него.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.ha-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install -r requirements-test.txt \
            "homeassistant==${{ matrix.ha }}" \
            pytest-github-actions-annotate-failures
      - name: Tests
        env:
          PYTEST_ADDOPTS: --junitxml=junit.xml
        run: make test
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ha-${{ matrix.ha }}
          path: junit.xml
          if-no-files-found: ignore
      - name: Publish test results
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit.xml
          check_name: Test results (HA ${{ matrix.ha }})
          comment_mode: off
